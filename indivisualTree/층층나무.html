<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>층층나무 소개</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap');
    :root { --green: #365b45; --light: #edf3e9; --cream: #fbfaf5; --text: #29352c; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 36px 18px; min-height: 100vh;
      background: linear-gradient(135deg, #eaf1e5, #f8f5e9);
      color: var(--text); font-family: 'Gowun Dodum', sans-serif;
    }
    .page { max-width: 900px; margin: 0 auto; }
    .eyebrow { color: #64816b; letter-spacing: .18em; font-size: .85rem; text-align: center; }
    h1 { font-family: 'Jua', sans-serif; color: var(--green); text-align: center; font-size: clamp(2.3rem, 6vw, 3.7rem); margin: 10px 0 8px; }
    .subtitle { text-align: center; margin: 0 0 30px; color: #68776a; }
    .card { background: rgba(255,255,255,.9); border: 1px solid #dce6d8; border-radius: 24px; overflow: hidden; box-shadow: 0 14px 36px rgba(46,74,49,.1); }
    .photo-area { padding: 24px 24px 12px; }
    .photo-frame {
      min-height: 300px; border: 2px dashed #b8cbb6; border-radius: 18px;
      background: #f2f6ef; display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative;
    }
    .photo-frame img { display: none; width: 100%; max-height: 480px; object-fit: cover; }
    .placeholder { text-align: center; padding: 32px; color: #718674; }
    .placeholder .icon { font-size: 3.2rem; display: block; margin-bottom: 10px; }
    .placeholder p { margin: 0 0 8px; font-size: 1.1rem; }
    .placeholder small { line-height: 1.6; }
    .upload { display: block; width: fit-content; margin: 14px auto 0; padding: 10px 18px; border-radius: 999px; background: var(--green); color: white; cursor: pointer; font-size: .95rem; }
    .upload input { display: none; }
    .content { padding: 12px 28px 30px; }
    .section { margin-top: 18px; }
    .section label, .section h2 { display: block; color: var(--green); font-family: 'Jua', sans-serif; font-size: 1.25rem; margin: 0 0 10px; }
    input[type="text"], textarea { width: 100%; border: 1px solid #d4e0d0; border-radius: 12px; padding: 13px 15px; font: inherit; color: var(--text); background: #fcfdfb; outline: none; }
    input[type="text"]:focus, textarea:focus { border-color: #789b7b; box-shadow: 0 0 0 3px rgba(120,155,123,.15); }
    textarea { min-height: 150px; resize: vertical; line-height: 1.8; }
    .hint { color: #819083; font-size: .85rem; margin: 7px 2px 0; }
    .footer { text-align: center; color: #829083; font-size: .85rem; margin-top: 18px; }
    @media (max-width: 600px) { body { padding: 22px 12px; } .photo-area { padding: 14px 14px 8px; } .content { padding: 8px 18px 22px; } .photo-frame { min-height: 230px; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="eyebrow">OUR GREEN FRIENDS · TREE GUIDE</div>
    <h1>🌿 나무 소개</h1>
    <p class="subtitle">사진과 특징을 기록하며 나무를 알아보아요.</p>

    <article class="card">
      <div class="photo-area">
        <div class="photo-frame">
          <img id="treePhoto" alt="층층나무 사진">
          <div class="placeholder" id="placeholder">
            <span class="icon">🌳</span>
            <p>층층나무 사진을 넣어 주세요</p>
            <small>아래 버튼을 눌러 컴퓨터에 저장된 사진을 선택할 수 있어요.</small>
          </div>
        </div>
        <label class="upload">📷 사진 선택하기 <input id="photoInput" type="file" accept="image/*"></label>
      </div>

      <div class="content">
        <div class="section">
          <label for="treeName">🌱 나무 이름</label>
          <input id="treeName" type="text" value="층층나무" placeholder="나무 이름을 입력하세요">
        </div>
        <div class="section">
          <label for="treeFeatures">🍃 층층나무의 특징</label>
          <textarea id="treeFeatures" placeholder="층층나무의 생김새, 잎, 꽃, 열매, 자라는 환경 등을 적어 보세요."></textarea>
          <p class="hint">예: 가지가 층층이 돌려나듯 퍼지는 모습, 잎과 꽃의 특징 등을 기록해 보세요.</p>
        </div>
      </div>
    </article>
    <p class="footer">나무를 관찰하고 나만의 식물 도감을 만들어 보세요.</p>
  </main>
  <script>
    const photoInput = document.getElementById('photoInput');
    const treePhoto = document.getElementById('treePhoto');
    const placeholder = document.getElementById('placeholder');
    let currentImageUrl = null;
    photoInput.addEventListener('change', (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      if (currentImageUrl) URL.revokeObjectURL(currentImageUrl);
      currentImageUrl = URL.createObjectURL(file);
      treePhoto.src = currentImageUrl;
      treePhoto.style.display = 'block';
      placeholder.style.display = 'none';
    });
  </script>
</body>
</html>
