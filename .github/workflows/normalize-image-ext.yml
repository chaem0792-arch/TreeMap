# images 폴더에 올라온 사진의 확장자를 모두 .JPG로 맞춰요.
# 사이트(index.html)는 사진을 ./images/이름.JPG 로만 불러오고,
# GitHub Pages는 대소문자를 구분하기 때문에 .jpg / .jpeg 로 올리면 사진이 안 보여요.
name: 사진 확장자 .JPG로 통일

on:
  push:
    branches: [main]
    paths: ['images/**', '.github/workflows/normalize-image-ext.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 확장자 바꾸기
        run: |
          shopt -s nullglob
          changed=0
          tools_ready=0
          to_jpeg() {
            # PNG·WEBP·BMP·GIF·TIFF·HEIC 같은 사진을 진짜 JPEG로 변환
            if [ "$tools_ready" = 0 ]; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq imagemagick libheif-plugin-libde265 >/dev/null || sudo apt-get install -y -qq imagemagick >/dev/null
              tools_ready=1
            fi
            convert "$1[0]" -auto-orient -quality 90 "$2.tmp.jpg" && mv "$2.tmp.jpg" "$2"
          }
          for f in images/*; do
            [ -f "$f" ] || continue
            mime=$(file -b --mime-type "$f")
            case "$mime" in image/*) ;; *) continue ;; esac
            base="${f%.*}"
            target="$base.JPG"
            if [ "$mime" = "image/jpeg" ]; then
              [ "$f" = "$target" ] && continue
              git mv -f "$f" "$target"
            else
              # 확장자가 무엇이든(.JPG로 이름만 바꾼 BMP 포함) 내용을 JPEG로 변환
              to_jpeg "$f" "$target" || { echo "변환 실패: $f"; continue; }
              [ "$f" != "$target" ] && git rm -q "$f"
              git add "$target"
            fi
            echo "$f -> $target"
            changed=1
          done
          echo "changed=$changed" >> "$GITHUB_ENV"

      - name: 커밋하고 올리기
        if: env.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git commit -m "images: 사진 확장자를 .JPG로 통일"
          git push
